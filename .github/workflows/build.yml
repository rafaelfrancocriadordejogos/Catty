name: Build iOS App

on:
  push:
    branches: [ develop, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Build and Archive
      run: |
        set -e
        echo "Iniciando build do projeto..."
        xcodebuild clean build -scheme Catty -configuration Release -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO || xcodebuild -list

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Catty-App
        path: |
          **/*.ipa
          **/build/**/*.app
          **/DerivedData/**/*.app
        if-no-files-found: ignore
        

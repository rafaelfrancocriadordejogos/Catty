name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest
        

    - name: Build Project
      run: |
        echo "Preparando o projeto para iOS..."
        xcodebuild -list || echo "Listando projeto..."

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Catty-App
        path: |
          *.ipa
          build/
          

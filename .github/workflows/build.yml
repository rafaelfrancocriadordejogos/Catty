name: Build iOS App

on:
  push:
    branches: [ develop, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: List Schemes and Build
      run: |
        echo "Verificando projetos e schemes disponíveis..."
        xcodebuild -list || true
        
        echo "Tentando compilar o projeto..."
        xcodebuild -alltargets -configuration Release build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO || true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: iOS-Build-Output
        path: |
          **/build/**/*.app
          **/DerivedData/**/*.app
          *.ipa
        if-no-files-found: ignore
        
